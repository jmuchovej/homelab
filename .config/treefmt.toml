#:tombi toml-version = "v1.1.0"
#:schema https://www.schemastore.org/treefmt.json

allow-missing-formatter = false
on-unmatched            = "info"
verbose                 = 1
excludes                = [
  "assets/**",
  # Generated by `just hubitat bundle` from formatted sources; never formatted itself
  "*.bundled.groovy",
  # Machine-generated hardware reports (nixos-facter) and vendored schemas
  "*/facter.json",
  "vendor/**",
  ".devenv/**",
  ".direnv/**",
  "*.{png,gif,ico,jpg,jpeg}",
  "*.{svg,xml}",
  "*.editorconfig",
  "*.envrc",
  "*.gitconfig",
  "*.git-blame-ignore-revs",
  "*.gitignore",
  "*.gitattributes",
  "*CODEOWNERS",
  "*LICENSE",
  "*flake.lock",
  "*[Mm]akefile",
]

[formatter.nixfmt]
  command  = "nixfmt"
  includes = [ "*.nix" ]
  priority = 3

# Formatters sharing a file type get distinct priorities: equal priorities run
# concurrently on the same file and treefmt then reports "file has changed".
[formatter.keep-sorted]
  command  = "keep-sorted"
  includes = [ "*" ]
  priority = 10

[formatter.deadnix]
  command  = "deadnix"
  options  = [
    "--edit",
    "--no-underscore",
    "--warn-used-underscore",
    "--no-lambda-pattern-names"
  ]
  includes = [ "*.nix" ]
  priority = 1

[formatter.just]
  command  = "treefmt-just"
  includes = [
    "[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    "*/[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    ".[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    "*/.[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]",
    "*.[Jj][Uu][Ss][Tt]",
    "*.[Jj][Uu][Ss][Tt][Ff][Ii][Ll][Ee]"
  ]

[formatter.oxfmt]
  command  = "oxfmt"
  options  = [ "-c", ".config/oxfmtrc.jsonc" ]
  excludes = [ "*.mdc" ]
  includes = [
    "*.{css,scss}",
    "*.graphql",
    "*.html",
    "*.{js,jsx,mjs,cjs}",
    "*.{json,json5,jsonc}",
    "*.{hbs,mustache}",
    "*.{ts,tsx,mts}",
    "*.vue",
    "*.{yml,yaml}",
    "*.{md,mdx}",
  ]

[formatter.oxipng]
  command  = "oxipng"
  options  = [ "--opt", "2" ]
  includes = [ "*.png" ]

[formatter.statix]
  command  = "treefmt-statix"
  includes = [ "*.nix" ]
  priority = 2

[formatter.tombi]
  command  = "tombi"
  # --offline: the schema catalog fetch fails inside the `nix flake check` sandbox
  options  = [ "format", "--offline" ]
  includes = [ "*.toml" ]

# Check-only on purpose: with --write-changes typos rewrote identifiers (`edn`,
# `zink`, a string-dispatched Groovy hook name). A finding fails the run; fix the
# word by hand or add it to .config/typos.toml.
[formatter.typos]
  command  = "typos"
  options  = [ "--force-exclude", "-c", ".config/typos.toml" ]
  includes = [ "*" ]
  priority = 20

[formatter.ruff-check]
  command  = "ruff"
  options  = [ "check", "--fix" ]
  includes = [ "*.py", "*.pyi" ]
  priority = 1

[formatter.ruff-format]
  command  = "ruff"
  options  = [ "format" ]
  includes = [ "*.py", "*.pyi" ]
  priority = 2

[formatter.tofu]
  command  = "tofu"
  options  = [ "fmt" ]
  includes = [ "*.tf", "*.tofu" ]

[formatter.shfmt]
  command  = "shfmt"
  includes = [ "*.sh" ]

[formatter.groovy]
  command  = "npm-groovy-lint"
  # --failon none: CodeNarc cannot parse Hubitat `#include` lines and reports a
  # parse "error" for every driver source; formatting still applies, so don't fail.
  options  = [ "-c", ".config/groovylintrc.yaml", "--format", "--failon", "none" ]
  includes = [ "*.groovy" ]
