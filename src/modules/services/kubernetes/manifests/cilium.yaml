# Cilium CNI — k3s HelmChart CR. k3s' helm-controller pulls the chart from
# helm.cilium.io at runtime (no Nix build-time fetch). `bootstrap: true` installs
# it during cluster bring-up, before the node can go Ready (k3s ships no CNI;
# started with --flannel-backend=none --disable-kube-proxy).
#
# Chart values live in cilium-values.yaml (schema-validated standalone);
# kubernetes.nix renders them into valuesContent.
---
# $schema: schemas/helmchart_v1.json
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  repo: https://helm.cilium.io
  chart: cilium
  version: 1.19.5
  targetNamespace: kube-system
  bootstrap: true
  valuesContent: |-
    @values@
