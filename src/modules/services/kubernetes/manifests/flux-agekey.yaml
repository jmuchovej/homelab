# $schema: schemas/secret-v1.json
#
# Flux sops decryption key. Seeded by the k3s aspect from the per-cluster
# `flux/agekey` sops value (secrets/<dc>.sops.yaml) so kustomize-controller can
# decrypt clusters/<domain>/config/*.sops.yaml. See clusters/AGENTS.md.
apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
type: Opaque
stringData:
  age.agekey: "@agekey@"
