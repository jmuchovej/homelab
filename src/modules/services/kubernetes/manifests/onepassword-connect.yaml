# 1Password Connect bootstrap secrets — template rendered by kubernetes.nix.
# Markers become sops placeholders at eval and real values at activation
# (sops-nix), so secret material never enters the store. Applied by the
# k3s-seed-secrets unit, NOT the k3s manifests dir.
---
# $schema: schemas/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
# $schema: schemas/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-connect-credentials
  namespace: external-secrets
type: Opaque
data:
  # sops value is already base64(1password-credentials.json); `data` expects
  # base64, so the mounted file decodes back to raw JSON.
  1password-credentials.json: "@connect-credentials@"
---
# $schema: schemas/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: op-connect-ro
  namespace: external-secrets
type: Opaque
stringData:
  token: "@ro-token@"
---
# $schema: schemas/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: op-connect-rw
  namespace: external-secrets
type: Opaque
stringData:
  token: "@rw-token@"
