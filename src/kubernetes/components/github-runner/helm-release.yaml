---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name ${GH_REPO}-runner
spec:
  chartRef:
    kind: OCIRepository
    # shared with every other scale set — the chart is identical
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/${GH_OWNER}/${GH_REPO}
    # one App installation covers every repo it is granted, so all scale sets
    # read the same secret
    githubConfigSecret: actions-runner-app

    # this is what workflows put in `runs-on:` — scale sets match by name, not
    # by the label list a classic self-hosted runner would carry.
    #
    # It must stay parameterized: the chart derives EVERY resource name from
    # this value (not from the release name), so a constant here would make
    # two scale sets collide on their ServiceAccount/Role/RoleBinding in this
    # shared namespace.
    runnerScaleSetName: ${GH_REPO}

    # scale to zero when idle — the cluster also carries media and inference
    # workloads. Cold start costs ~30s on the first queued job.
    minRunners: 0
    maxRunners: ${RUNNER_MAX}

    containerMode:
      # kubernetes mode runs each job in its own pod instead of a privileged
      # docker-in-docker sidecar — the right default for public repos, where a
      # fork PR is untrusted code
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - ReadWriteOnce
        # node-local ZFS. The class sets `shared: "yes"`, which this mode
        # requires: the runner pod and the job pod it spawns mount the same
        # volume on the same node, and a ZFS dataset otherwise mounts at
        # exactly one path (the second pod hangs in ContainerCreating).
        storageClassName: zfs
        resources:
          requests:
            storage: 10Gi

    controllerServiceAccount:
      # matches `fullnameOverride` on the controller HelmRelease
      name: actions-runner-controller
      namespace: actions-runner-system

    template:
      metadata:
        labels:
          runner: *name
      spec:
        # soft, not required: harmless on today's single node, and spreads
        # runners automatically once the cluster grows
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      runner: *name
                  topologyKey: kubernetes.io/hostname
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.336.0@sha256:281a9a090522fafbf4967f158b8c97d03552b1978b688893c5f7cb1944bc5fe5
            command:
              - /home/runner/run.sh
            env:
              # kubernetes mode otherwise rejects any job that does not declare
              # a `container:` — most of ours don't
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
        # NOTE: deliberately no `serviceAccountName`. Setting one disables the
        # chart's kube-mode RBAC templates, which otherwise generate a
        # namespaced Role (pods, pods/exec, pods/log) bound to a generated SA.
        # home-ops overrides it because their workflows drive Talos and the
        # cluster; ours don't, so we keep least privilege.
