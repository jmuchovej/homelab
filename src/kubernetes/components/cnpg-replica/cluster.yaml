---
# $schema: https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-db
  annotations:
    # Flux may never delete a database. Deleting this Cluster drops its PVCs
    # and a recreate re-runs pg_basebackup — a full re-clone of the source
    # across the WAN. Removal must always be deliberate (kubectl delete).
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  storage:
    size: ${DB_SIZE}
  bootstrap:
    pg_basebackup:
      source: ${SOURCE_NAME}
  replica:
    enabled: true
    source: ${SOURCE_NAME}
  externalClusters:
    - name: ${SOURCE_NAME}
      connectionParameters:
        host: ${SOURCE_HOST}
        user: streaming_replica
        sslmode: verify-ca
        dbname: postgres
      # `-source-` secrets, NOT the cluster's own `${APP}-db-ca` /
      # `${APP}-db-replication` — those names are taken by the certs CNPG
      # issues for THIS cluster, and colliding on them makes the operator
      # adopt the source's material as its own.
      sslKey:
        name: ${APP}-db-source-replication
        key: tls.key
      sslCert:
        name: ${APP}-db-source-replication
        key: tls.crt
      sslRootCert:
        name: ${APP}-db-source-ca
        key: ca.crt
