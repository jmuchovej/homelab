---
# The source cluster's replication identity, pushed to 1Password by the
# primary's PushSecret. Fields are base64 there (1P fields are single-line),
# so both templates decode. `refreshInterval` must stay well under the
# certificate lifetime — CNPG renews the client cert 7 days before a 90-day
# expiry, and a stale copy here breaks replication silently.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-db-source-replication
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-connect-ro
  target:
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt | b64dec }}"
        tls.key: "{{ .key | b64dec }}"
  data:
    - secretKey: crt
      remoteRef:
        key: &item ${SOURCE_ITEM}
        property: replication.crt
    - secretKey: key
      remoteRef:
        key: *item
        property: replication.key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-db-source-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-connect-ro
  target:
    template:
      data:
        ca.crt: "{{ .ca | b64dec }}"
  data:
    - secretKey: ca
      remoteRef:
        key: ${SOURCE_ITEM}
        property: ca.crt
