---
# Auth-flow route: deliberately NOT targeted by the SecurityPolicy, so login
# and callback requests can never be gated by the auth they implement.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing-${ST_KEY}-outpost
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
  hostnames:
    - syncthing-${ST_KEY}.${DC_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: ak-outpost-proxy
          namespace: auth
          port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing-${ST_KEY}
  labels:
    authentik.rbn/enabled: "true"
  annotations:
    authentik.rbn/name: Syncthing (${ST_KEY})
    authentik.rbn/group: Sync
    authentik.rbn/icon: di:syncthing
    # the ONE place a per-user binding is warranted: the `syncthing` group
    # gates the entry point, but an instance is reachable only by its owner
    authentik.rbn/access: user:${ST_KEY}
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
  hostnames:
    - syncthing-${ST_KEY}.${DC_DOMAIN}
  rules:
    - backendRefs:
        - name: syncthing-${ST_KEY}
          port: 8384
