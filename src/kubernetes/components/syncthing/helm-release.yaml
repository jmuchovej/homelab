---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name syncthing-${ST_KEY}
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    controllers:
      syncthing-${ST_KEY}:
        # RWO PVC on a single pinned node — a rolling update would deadlock
        strategy: Recreate
        initContainers:
          identity:
            image:
              repository: mirror.gcr.io/alpine
              tag: "3.23"
            command: ["/bin/sh", "-c"]
            args:
              - |
                mkdir -p /var/st/config /var/st/data
                install -m 0600 /identity/key.pem /identity/cert.pem /var/st/config/
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/syncthing/syncthing
              tag: 2.1.2@sha256:4464f4161dd0251e20d46bb3aec83363db75d80cef1abdd5d5fd4054b04a004d
            env:
              TZ: America/New_York
              STNODEFAULTFOLDER: "true"
              # config and database BOTH stay on the local PVC. v2 keeps its
              # index in SQLite, which corrupts over NFS locking — never point
              # either of these at the /data mount.
              STCONFDIR: /var/st/config
              STDATADIR: /var/st/data
              STGUIADDRESS: 0.0.0.0:8384
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  # first start after a restore re-verifies the index
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: ${ST_MEM_LIMIT}

    defaultPodOptions:
      # must be the node with impulse/ attached locally — the whole design
      # depends on /data being a local ZFS path and not the NFS re-export.
      # Injected per cluster by clusters/<domain>/flux/cluster-apps.ks.yaml.
      nodeSelector:
        kubernetes.io/hostname: ${ST_NODE}
      securityContext:
        # Fixed for every instance, matching the dataset owner set by
        # <rbn/services/syncthing/datasets>. Deliberately NOT the human's uid:
        # that number would then live here AND in sops, and two copies drift.
        # Their access to the tree comes from a POSIX ACL instead.
        runAsNonRoot: true
        runAsUser: 8384
        runAsGroup: 8384
        fsGroup: 8384
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: syncthing-${ST_KEY}
        # multi-service releases suffix every key — pin the name the route expects
        forceRename: syncthing-${ST_KEY}
        ports:
          http:
            port: 8384
      sync:
        controller: syncthing-${ST_KEY}
        forceRename: syncthing-${ST_KEY}-sync
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${ST_LB_IP}
        ports:
          tcp:
            port: 22000
            protocol: TCP
          quic:
            port: 22000
            protocol: UDP

    persistence:
      config:
        existingClaim: syncthing-${ST_KEY}-config
        advancedMounts:
          syncthing-${ST_KEY}:
            identity:
              - path: /var/st
            app:
              - path: /var/st
      identity:
        type: secret
        name: syncthing-${ST_KEY}-identity
        advancedMounts:
          syncthing-${ST_KEY}:
            identity:
              - path: /identity
                readOnly: true
      data:
        # fsGroup does NOT apply to hostPath. The dataset, its quota, its
        # ownership and the owner's ACL are all provisioned on da-gr75 by
        # <rbn/services/syncthing/datasets>, which orders itself before k3s.
        type: hostPath
        hostPath: /impulse/syncthing/${ST_KEY}
        advancedMounts:
          syncthing-${ST_KEY}:
            app:
              - path: /data
