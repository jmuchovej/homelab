---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../core
  # auth (da) — deliberately NOT in core, for the same reason as ci below but
  # with worse failure mode. authentik's OIDC signing keypair lives in its
  # Postgres, so a second Helm release on a second CNPG database is a second
  # IdP with a different JWKS — tokens minted by one are rejected by the
  # other's apiserver, and `id.jm0.io` can never be load-balanced across them.
  # Promote to core only alongside replicated Postgres, never before.
  - ../../../apps/auth
  # cloudflared for id.${DOMAIN} (da) — NOT in core for the same reason as
  # auth: a connector in en would route to en's authentik, so Cloudflare would
  # round-robin between two IdPs with different signing keys.
  # ORDER MATTERS: `tofu apply` the tunnel first, then store
  # `tofu output -raw cloudflare-tunnel-id-token` as Cloudflare/tunnel-id-token
  # in 1Password. Reconciling ahead of that just parks the ExternalSecret in
  # SecretSyncedError until the item exists — it recovers on its own.
  - ../../../apps/network/cloudflare-tunnel
  # ci (da) — deliberately NOT in core: a second cluster running the same
  # scale-set name would collide on registration with GitHub. Promote to core
  # only alongside a per-cluster `runnerScaleSetName`.
  - ../../../apps/actions-runner-system
  # media (da)
  - ../../../apps/media/namespace.yaml
  - ../../../apps/media/immich
  - ../../../apps/media/jellyfin
  - ../../../apps/media/lidarr
  - ../../../apps/media/plex
  - ../../../apps/media/prowlarr
  - ../../../apps/media/qbittorrent
  - ../../../apps/media/radarr
  - ../../../apps/media/readarr
  - ../../../apps/media/recyclarr
  - ../../../apps/media/seerr
  - ../../../apps/media/sonarr
  - ../../../apps/media/tautulli
  # home-automation (da)
  - ../../../apps/home-automation/namespace.yaml
  - ../../../apps/home-automation/home-assistant
  - ../../../apps/home-automation/hubitat
  # local-ai (da) — GPU inference; retag to en if it follows the GPU
  - ../../../apps/local-ai/namespace.yaml
  - ../../../apps/local-ai/chroma
  # TEMPORARILY pruned: model-sync roster overran the node's disk (DiskPressure
  # eviction storm, 2026-07-22). Re-add once model storage is resolved.
  # - ../../../apps/local-ai/ollama
  - ../../../apps/local-ai/open-webui
  # home (da)
  - ../../../apps/home/namespace.yaml
  - ../../../apps/home/actual
  - ../../../apps/home/homebox
  - ../../../apps/home/linkding
  - ../../../apps/home/n8n
  - ../../../apps/home/split-pro
  # games (da)
  - ../../../apps/games/namespace.yaml
  - ../../../apps/games/minecraft
