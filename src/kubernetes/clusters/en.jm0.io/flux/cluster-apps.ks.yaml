---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  # A PVC created while no default StorageClass exists is stamped with
  # storageClassName: "" permanently and never binds — the classes live in
  # cluster-config, so apps must not reconcile ahead of it.
  # NOTE: en has no storage-classes.yaml yet; it needs one (and an ST_NODE
  # substitution) before any PVC-claiming app is selected here.
  dependsOn:
    - name: cluster-config
      namespace: flux-system
  interval: 1h
  path: ./src/kubernetes/clusters/en.jm0.io/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substitute:
              DATACENTER: en
              DC_DOMAIN: en.jm0.io
              DOMAIN: jm0.io
              ADMIN_CIDR: 10.99.0.0/16
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                  upgrade:
                    crds: CreateReplace
                    remediation:
                      retries: 2
