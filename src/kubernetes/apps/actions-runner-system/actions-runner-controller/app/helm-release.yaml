---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name actions-runner-controller
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
  interval: 1h
  values:
    # the chart derives its ServiceAccount name from the release fullname, so
    # this is what each scale set must name in `controllerServiceAccount`
    fullnameOverride: *name
