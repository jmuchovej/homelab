---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valkey
spec:
  interval: 1h
  path: ./src/kubernetes/apps/databases/valkey/app
  # no postBuild: nothing here needs substitution (TCP service, no hostnames)
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: databases
  wait: true
