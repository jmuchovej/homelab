---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name valkey
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    controllers:
      valkey:
        # single replica on an RWO data volume
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 8.1.9@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 6379
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      # the k8s replacement for the old traefik TCP entrypoint: a Cilium LB
      # on the LAN — same open-on-LAN posture the NixOS valkey had (bind
      # 0.0.0.0, no auth; LAN-only by construction, nothing DNATs here)
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.69.1.61
        externalTrafficPolicy: Local
        ports:
          valkey:
            port: *port

    persistence:
      data:
        existingClaim: valkey-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
