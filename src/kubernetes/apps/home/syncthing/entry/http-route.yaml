---
# Auth-flow route: deliberately NOT targeted by the SecurityPolicy, so login
# and callback requests can never be gated by the auth they implement.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing-outpost
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
  hostnames:
    - syncthing.${DC_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: ak-outpost-proxy
          namespace: auth
          port: 9000
---
# Name MUST stay `syncthing`: discovery keys on the route name and
# `local.apps = merge(frozen, discovered)` lets this override — and then
# replace — the frozen `syncthing` entry in apps.tofu.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  labels:
    authentik.rbn/enabled: "true"
  annotations:
    authentik.rbn/name: Syncthing
    authentik.rbn/group: Sync
    authentik.rbn/icon: di:syncthing
    authentik.rbn/access: group:syncthing
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
  hostnames:
    - syncthing.${DC_DOMAIN}
  rules:
    # One rule per instance owner. The header is whatever the outpost asserted
    # AFTER ext-auth overwrote it, because the SecurityPolicy sets
    # recomputeRoute — a client-supplied value only ever selects the initial
    # (discarded) route. 302 not 301: the target depends on who is logged in,
    # so it must never be cached as permanent.
    - matches:
        - headers:
            - name: x-authentik-username
              value: ypah-xuuk
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: syncthing-ypah-xuuk.${DC_DOMAIN}
            statusCode: 302
    - matches:
        - headers:
            - name: x-authentik-username
              value: ggms-eksu
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: syncthing-ggms-eksu.${DC_DOMAIN}
            statusCode: 302
    - matches:
        - headers:
            - name: x-authentik-username
              value: gasm-egbe
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: syncthing-gasm-egbe.${DC_DOMAIN}
            statusCode: 302
    - matches:
        - headers:
            - name: x-authentik-username
              value: floe-rlfn
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: syncthing-floe-rlfn.${DC_DOMAIN}
            statusCode: 302
