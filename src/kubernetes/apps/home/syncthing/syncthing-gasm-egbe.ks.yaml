---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncthing-gasm-egbe
spec:
  dependsOn:
    - name: envoy-config
      namespace: network
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./src/kubernetes/components/syncthing
  postBuild:
    substitute:
      ST_KEY: gasm-egbe
      ST_DB_SIZE: 5Gi
      ST_MEM_LIMIT: 1Gi
      ST_LB_IP: 10.69.1.72
  targetNamespace: home
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
