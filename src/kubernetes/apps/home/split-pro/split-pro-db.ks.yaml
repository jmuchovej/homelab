---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: split-pro-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: databases
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./src/kubernetes/components/cnpg-database
  postBuild:
    substitute:
      # pg_cron was DROPPED when this DB moved off NixOS (CNPG images lack
      # it); the recurring-expense scheduler is a known gap until an image
      # carries it.
      APP: split-pro
      DB_SIZE: 2Gi
      # convention: DB LBs live at ${LB_PREFIX}.5x/6x
      DB_LB_IP: ${LB_PREFIX}.60
  targetNamespace: home
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
