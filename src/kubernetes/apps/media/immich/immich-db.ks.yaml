---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: databases
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./src/kubernetes/components/cnpg-database
  components:
    # VectorChord image + preload — MUST be a component: the cluster-apps
    # parent clobbers per-app ks spec.patches (see the component's header)
    - ../cnpg-vectorchord
  postBuild:
    substitute:
      APP: immich
      DB_SIZE: 10Gi
      # convention: DB LBs live at ${LB_PREFIX}.5x
      DB_LB_IP: ${LB_PREFIX}.59
  targetNamespace: media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
