---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarr-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: databases
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./src/kubernetes/components/cnpg-database
  postBuild:
    substitute:
      APP: sonarr
      DB_SIZE: 5Gi
      # convention: DB LBs live at ${LB_PREFIX}.5x
      DB_LB_IP: ${LB_PREFIX}.54
  targetNamespace: media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
