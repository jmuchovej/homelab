---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cloudflare-tunnel-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-connect-ro
  target:
    name: *name
  data:
    # Written by tofu (`onepassword_item.cf-tunnel-idp` in
    # src/terraform/da.cloudflare-tunnel.tofu), not by hand — recreating the
    # tunnel rewrites the item and this re-syncs. base64({"a","t","s"}); the
    # whole blob is the credential, so it is passed to cloudflared verbatim.
    #
    # Referenced by title rather than UUID so a tofu-side recreate of the item
    # does not strand this ref.
    - secretKey: tunnel_token
      remoteRef:
        key: cf-tunnel-idp
        property: password
