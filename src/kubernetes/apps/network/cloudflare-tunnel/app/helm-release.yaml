---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name cloudflare-tunnel
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    controllers:
      cloudflare-tunnel:
        replicas: 2
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: mirror.gcr.io/cloudflare/cloudflared
              tag: 2026.7.2@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
            args:
              - tunnel
              # Config (ingress rules) is remotely managed — it lives in
              # cloudflare_zero_trust_tunnel_cloudflared_config, not here.
              - --no-autoupdate
              - run
            env:
              TZ: America/New_York
              TUNNEL_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cloudflare-tunnel-secrets
                    key: tunnel_token
              # Connectors are stateless and interchangeable; surface metrics
              # so a dead connector is visible without reading Cloudflare's UI.
              TUNNEL_METRICS: 0.0.0.0:8080
              # QUIC (UDP/7844) to the edge never completes its handshake from
              # this cluster — "timeout: handshake did not complete in time" on
              # every edge IP, while cloudflared's own precheck passes TCP to
              # region1/region2 and reports `suggested_protocol=http2`. Auto
              # would eventually fall back, but the probes below kill the pod at
              # ~40s, before that happens, so it crash-loops instead. Pinning
              # http2 is cloudflared's own recommendation here; the underlying
              # UDP path is worth fixing separately, then this can be dropped.
              TUNNEL_TRANSPORT_PROTOCOL: http2
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # The point is surviving a node going away, so spread is a hard rule.
      # da deliberately runs a single node today; that is fine rather than a
      # conflict — with one topology domain the skew is 0, so both replicas
      # schedule and still buy gap-free rolling updates. This becomes
      # load-bearing when da scales to its planned 2-4 nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *name

    service:
      app:
        controller: cloudflare-tunnel
        ports:
          http:
            port: 8080
