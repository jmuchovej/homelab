---
# Protective + inert. Selecting every kube-system pod with an allow-all rule
# guarantees the system tier (kube-dns, cilium-operator, metrics) can never be
# accidentally locked down by a future cluster-wide policy. Behaviourally
# identical to "no policy", so it changes nothing today.
# $schema: https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-system-allow-all
  namespace: kube-system
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - cluster
        - world
    - fromEndpoints:
        - {}
  egress:
    - toEntities:
        - cluster
        - world
    - toEndpoints:
        - {}
