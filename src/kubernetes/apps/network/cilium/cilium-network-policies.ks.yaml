---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-network-policies
spec:
  interval: 1h
  path: ./src/kubernetes/apps/network/cilium/network-policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # no targetNamespace: the tree mixes cluster-scoped CCNPs with a kube-system CNP
  wait: false
