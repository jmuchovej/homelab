---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # DELIBERATELY the same name as the primary site's authentik ks. Apps that
  # need an IdP say `dependsOn: auth/authentik`, and that file is shared — so
  # the name has to resolve at every site. Both mean the same thing to a
  # dependent: authentik is wired up in this cluster. What differs is how —
  # da runs it, a secondary site is managed by da's.
  name: authentik
spec:
  interval: 1h
  path: ./src/kubernetes/apps/auth/remote-cluster/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  wait: true
