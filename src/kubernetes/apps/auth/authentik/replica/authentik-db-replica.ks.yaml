---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: databases
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./src/kubernetes/components/cnpg-replica
  postBuild:
    substitute:
      # literal, NOT *name — APP names the app/database/role, while the
      # anchor would be this ks ("authentik-db") and render "authentik-db-db"
      APP: authentik
      DB_SIZE: 10Gi
      SOURCE_NAME: authentik-db-da
      # da's authentik-db LoadBalancer, reachable since the lab renumber +
      # the ZeroTier managed routes. NOT a hostname: the source's server cert
      # carries no SAN for this address, which is why the component pins
      # sslmode=verify-ca.
      SOURCE_HOST: 10.32.1.51
      SOURCE_ITEM: authentik-db-replication
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  # bootstrap is a full pg_basebackup across the WAN; don't let it gate
  # anything else in the cluster while it runs
  wait: false
