---
# Exports this cluster's replication identity INTO 1Password so the replica
# at the other DC can authenticate as `streaming_replica`. CNPG renews the
# client cert 7 days before a 90-day expiry, so this must keep running — a
# one-time copy breaks replication within a quarter, silently.
# Fields are base64 (1P fields are single-line); the consuming ExternalSecret
# decodes. REQUIRES the Connect token to have WRITE access to the vault.
#
# Only the PRIMARY may push. After a promotion this moves with the primary
# role — see components/cnpg-replica/AGENTS.md.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-db-replication
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: op-connect-rw
      kind: ClusterSecretStore
  selector:
    secret:
      name: authentik-db-replication
  template:
    data:
      tls.crt: '{{ index . "tls.crt" | b64enc }}'
      tls.key: '{{ index . "tls.key" | b64enc }}'
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: &item authentik-db-replication
          property: replication.crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: *item
          property: replication.key
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-db-ca
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: op-connect-rw
      kind: ClusterSecretStore
  selector:
    secret:
      name: authentik-db-ca
  template:
    data:
      ca.crt: '{{ index . "ca.crt" | b64enc }}'
  data:
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: authentik-db-replication
          property: ca.crt
