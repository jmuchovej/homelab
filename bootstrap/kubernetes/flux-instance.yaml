---
# $schema: ./schemas/fluxinstance_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
spec:
  distribution:
    version: "2.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: false
  sync:
    kind: GitRepository
    url: https://github.com/jmuchovej/homelab
    ref: refs/heads/main
    path: kubernetes/clusters/@dc-domain@/flux
