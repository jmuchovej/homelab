# $schema: ../../../vendor/schemas/cilium-values.json
#
# Cilium chart values — rendered into cilium.yaml's valuesContent by
# kubernetes.nix. The schema is vendored from the chart itself and stamped
# with the chart version in schemas/SOURCES.json; after bumping spec.version
# in cilium.yaml, run `just k8s update-schemas` (the build check enforces
# this).
#
# Replace flannel + kube-proxy. With kube-proxy gone, the in-cluster
# `kubernetes` Service isn't routable until Cilium is up, so Cilium reaches
# the apiserver directly on loopback:6443. This is node-agnostic: servers run
# the supervisor there, and agents run a client-side load balancer on the same
# 127.0.0.1:6443 that forwards to the servers. Both the Cilium agent AND the
# operator run hostNetwork (chart default), so loopback resolves to the host on
# each node. (NOT 7445 — that's Talos KubePrism, which k3s doesn't run.)
kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443

ipam:
  mode: kubernetes
routingMode: native
autoDirectNodeRoutes: true
# Pod CIDR — traffic within it is natively routed; outside it is masqueraded.
ipv4NativeRoutingCIDR: 10.244.0.0/16
endpointRoutes:
  enabled: true

# BGP control plane advertises LoadBalancer IPs to MikroTik. The BGP CRs
# (peer, cluster config, LB IP pool) live in the Flux tree under
# kubernetes/apps/network/cilium-bgp/, not here.
bgpControlPlane:
  enabled: true
l2announcements:
  enabled: false

# Don't let Cilium's embedded Envoy bind host ports — ingress is Envoy Gateway.
envoy:
  enabled: false
hubble:
  enabled: false

# Coexist politely with any other CNI conflists on the host.
cni:
  exclusive: false

socketLB:
  enabled: true
  hostNamespaceOnly: true

operator:
  replicas: 1
  rollOutPods: true
rollOutCiliumPods: true
