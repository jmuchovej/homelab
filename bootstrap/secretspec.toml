#:tombi toml-version = "v1.1.0"

[project]
  name     = "bootstrap"
  revision = "1.0"

[providers]
  op = { uri = "onepassword://Homelab Bootstrap" }

[profiles.default]
  CLOUDFLARE_API_TOKEN  = {
    description = "API Token from Cloudflare",
    ref         = { item = "Bootstrap Cloudflare", field = "api-token" }
  }
  CLOUDFLARE_ACCOUNT_ID = {
    description = "Cloudflare Account ID",
    ref         = { item = "Bootstrap Cloudflare", field = "account-id" }
  }
  CLOUDFLARE_ZONE_ID    = {
    description = "Cloudflare Zone ID for domain",
    ref         = { item = "Bootstrap Cloudflare", field = "zone-id" }
  }

  [profiles.default.defaults]
    required  = true
    providers = [ "op" ]
