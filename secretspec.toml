#:tombi toml-version = "v1.1.0"

[project]
  name     = "homelab"
  revision = "1.0"

[providers]
  op = { uri = "onepassword://Homelab" }
  op-bootstrap = { uri = "onepassword://Homelab Bootstrap" }

[profiles.default]
  HUBITAT_URL               = {
    description = "Base URL of the Hubitat hub, e.g. http://10.32.x.y — used by `just hubitat push|probe`.",
    required    = true,
  }
  HUBITAT_USERNAME          = {
    description = "Hubitat hub login; only when hub security is enabled.",
    required    = false,
  }
  HUBITAT_PASSWORD          = {
    description = "Hubitat hub password; only when hub security is enabled.",
    required    = false,
  }
  SOPS_AGE_KEY              = {
    description = "The `age` key for decrypting `sops` secrets",
    ref         = { item = "SOPS_AGE_KEY", field = "password" },
    providers   = [ "op" ],
    required    = true,
  }
  TOFU_R2_ACCESS_KEY_ID     = {
    description = "Cloudflare R2 Access-Key-ID",
    ref         = { item = "Cloudflare R2", field = "access-key-id" },
    providers   = [ "op" ],
  }
  TOFU_R2_SECRET_ACCESS_KEY = {
    description = "Cloudflare R2 Secret-Access-Key",
    ref         = { item = "Cloudflare R2", field = "secret-access-key" },
    providers   = [ "op" ],
  }
  TOFU_R2_ENDPOINT          = {
    description = "Cloudflare R2 Endpoint",
    ref         = { item = "Cloudflare R2", field = "endpoint" },
    providers   = [ "op" ],
  }
  TOFU_STATE_PASSPHRASE     = {
    description = "Passphrase to decrypt OpenTofu state",
    ref         = { item = "OpenTofu State", field = "password" },
    providers   = [ "op-bootstrap" ],
  }

[profiles.development]

[scopes.tofu]
  secrets = [
    "SOPS_AGE_KEY",
    "TOFU_R2_ACCESS_KEY_ID",
    "TOFU_R2_SECRET_ACCESS_KEY",
    "TOFU_R2_ENDPOINT",
    "TOFU_STATE_PASSPHRASE"
  ]
