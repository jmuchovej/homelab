[project]
  name     = "homelab"
  revision = "1.0"

[profiles.default]
  HUBITAT_URL      = {
    description = "Base URL of the Hubitat hub, e.g. http://10.32.x.y — used by `just hubitat push|probe`.",
    required    = true
  }
  HUBITAT_USERNAME = {
    description = "Hubitat hub login; only when hub security is enabled.",
    required    = false
  }
  HUBITAT_PASSWORD = {
    description = "Hubitat hub password; only when hub security is enabled.",
    required    = false
  }

# Empty on purpose: inherits everything from `default`. secretspec does not fall back to
# `default` when the configured profile (user config: `development`) is undefined.
[profiles.development]
