---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: databases
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/components/cnpg-database
  postBuild:
    substitute:
      # literal, NOT *name — the anchor is "authentik-db" (this ks), while
      # APP names the app/database/role; *name here would render
      # cluster "authentik-db-db".
      APP: authentik
      DB_SIZE: 10Gi
      DB_LB_OCTET: "51"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
  wait: true
