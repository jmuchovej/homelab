---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncthing-entry
spec:
  dependsOn:
    - name: envoy-config
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/home/syncthing/entry
  targetNamespace: home
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
