---
# One GitHub App installation covers every repo it has been granted, so a
# single secret backs all scale sets. The secret keys below are the names ARC
# looks for; they are not free-form.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name actions-runner-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-connect-ro
  target:
    name: *name
  data:
    - secretKey: github_app_id
      remoteRef:
        key: &item GitHub Actions Runner
        property: app-id
    - secretKey: github_app_installation_id
      remoteRef:
        key: *item
        property: installation-id
    - secretKey: github_app_private_key
      remoteRef:
        key: *item
        property: private-key
