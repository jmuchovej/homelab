---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: waypoints-runner
spec:
  dependsOn:
    - name: actions-runner-controller
  interval: 1h
  path: ./kubernetes/components/github-runner
  postBuild:
    substitute:
      GH_OWNER: jmuchovej
      GH_REPO: waypoints
      RUNNER_NAME: waypoints
      RUNNER_MAX: "2"
      JOB_CPU: "4"
      JOB_MEMORY: 16Gi
      JOB_SCRATCH: 40Gi
      RUNNER_DISK: 100Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runner-system
  wait: true
