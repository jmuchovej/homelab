---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hass-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: databases
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/components/cnpg-database
  postBuild:
    substitute:
      # `hass`, not `home-assistant`: renaming would orphan da's imported
      # volume, which carries the NixOS source database's name
      APP: hass
      DB_SIZE: 10Gi
      DB_LB_OCTET: "52"
  targetNamespace: home-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
