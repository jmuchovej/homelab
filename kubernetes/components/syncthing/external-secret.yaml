---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing-${ST_KEY}-identity
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-connect-ro
  target:
    template:
      data:
        cert.pem: "{{ .cert }}"
        key.pem: "{{ .key }}"
  data:
    # An instance's identity IS its device ID, so the same user's instance in
    # another datacenter is a DIFFERENT device and must never share this
    # keypair — hence the ${DATACENTER} prefix. It cannot be a 1Password
    # section: the Connect provider resolves `property` against field labels
    # flat across the item, so sections are cosmetic and same-label fields in
    # different sections collide.
    - secretKey: cert
      remoteRef:
        key: Syncthing
        property: ${DATACENTER}-${ST_KEY}-cert
    - secretKey: key
      remoteRef:
        key: Syncthing
        property: ${DATACENTER}-${ST_KEY}-key
